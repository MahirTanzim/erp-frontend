<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Warehouses - ERP</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->
    <div class="bg-dark text-white p-3" style="width: 250px; min-height: 100vh;">

        <h4 class="mb-4">ERP System</h4>

        <ul class="nav flex-column">

            <li class="nav-item">
                <a class="nav-link text-white" href="dashboard.html">Dashboard</a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" href="employees.html">Employees</a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" href="departments.html">Departments</a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" href="products.html">Products</a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" href="#">Inventory</a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white active" href="warehouses.html">Warehouses</a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" href="#">Suppliers</a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" href="#">Purchase Orders</a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" href="#">Customers</a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" href="#">Sales Orders</a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" href="#">Invoices</a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" href="#">Payments</a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" href="#">Users</a>
            </li>

            <li class="nav-item">
                <a class="nav-link text-white" href="#">Audit Logs</a>
            </li>

            <li class="nav-item mt-3">
                <button class="btn btn-danger w-100" onclick="logout()">
                    Logout
                </button>
            </li>

        </ul>
    </div>


    <!-- Main Content -->
    <div class="flex-grow-1 p-4">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2>Warehouses</h2>

            <button
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#addWarehouseModal">
                Add Warehouse
            </button>

        </div>


        <!-- Warehouse Table -->
        <div class="card">

            <div class="card-body">

                <table class="table table-striped">

                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Warehouse Code</th>
                        <th>Name</th>
                        <th>Location</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody id="warehouseTableBody">
                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<!-- Add Warehouse Modal -->

<div
    class="modal fade"
    id="addWarehouseModal"
    tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Add Warehouse
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <div class="mb-3">

                    <label class="form-label">
                        Warehouse Code
                    </label>

                    <input
                        type="text"
                        id="warehouseCode"
                        class="form-control"
                        placeholder="WH001">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Warehouse Name
                    </label>

                    <input
                        type="text"
                        id="warehouseName"
                        class="form-control"
                        placeholder="Main Warehouse">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Location
                    </label>

                    <input
                        type="text"
                        id="warehouseLocation"
                        class="form-control"
                        placeholder="Dhaka">

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        id="warehouseDescription"
                        class="form-control">
                    </textarea>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">
                    Cancel
                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="addWarehouse()">
                    Save Warehouse
                </button>

            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/api.js"></script>
<script src="js/warehouse.js"></script>

</body>
</html>
