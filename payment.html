<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments | Mini ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-2 bg-dark text-white min-vh-100 p-3">
                <h4 class="mb-4">Mini ERP</h4>
                <nav class="nav flex-column">
                    <a class="nav-link text-white" href="dashboard.html">Dashboard</a>
                    <a class="nav-link text-white" href="employees.html">Employees</a>
                    <a class="nav-link text-white" href="departments.html">Departments</a>
                    <a class="nav-link text-white" href="products.html">Products</a>
                    <a class="nav-link text-white" href="warehouses.html">Warehouses</a>
                    <a class="nav-link text-white" href="inventory.html">Inventory</a>
                    <a class="nav-link text-white" href="suppliers.html">Suppliers</a>
                    <a class="nav-link text-white" href="purchase-orders.html">Purchase Orders</a>
                    <a class="nav-link text-white" href="customers.html">Customers</a>
                    <a class="nav-link text-white" href="sales-orders.html">Sales Orders</a>
                    <a class="nav-link text-white" href="invoices.html">Invoices</a>
                    <a class="nav-link text-white active" href="payments.html">Payments</a>
                    <button class="btn btn-outline-light mt-3" onclick="logout()">Logout</button>
                </nav>
            </aside>

            <main class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Payments</h2>
                    <button class="btn btn-primary" data-bs-toggle="modal"
                            data-bs-target="#paymentModal">
                        + Record Payment
                    </button>
                </div>

                <div id="message"></div>

                <div class="card shadow-sm">
                    <div class="card-body table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Invoice</th>
                                    <th>Amount</th>
                                    <th>Method</th>
                                    <th>Payment Date</th>
                                    <th>Reference</th>
                                </tr>
                            </thead>
                            <tbody id="paymentTableBody">
                                <tr>
                                    <td colspan="6" class="text-center">
                                        Loading payments...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="paymentModal" tabindex="-1"
         aria-labelledby="paymentModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="paymentForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="paymentModalLabel">
                            Record Payment
                        </h5>
                        <button type="button" class="btn-close"
                                data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body">
                        <div id="formMessage"></div>

                        <div class="mb-3">
                            <label for="invoiceId" class="form-label">Invoice</label>
                            <select id="invoiceId" class="form-select" required>
                                <option value="">Select invoice</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="amount" class="form-label">Amount</label>
                            <input type="number" id="amount" class="form-control"
                                   min="0.01" step="0.01" required>
                        </div>

                        <div class="mb-3">
                            <label for="method" class="form-label">Payment Method</label>
                            <select id="method" class="form-select" required>
                                <option value="">Select method</option>
                                <option value="CASH">Cash</option>
                                <option value="BANK_TRANSFER">Bank Transfer</option>
                                <option value="CARD">Card</option>
                                <option value="MOBILE_BANKING">Mobile Banking</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="paymentDate" class="form-label">
                                Payment Date
                            </label>
                            <input type="date" id="paymentDate"
                                   class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="reference" class="form-label">
                                Reference (optional)
                            </label>
                            <input type="text" id="reference" class="form-control"
                                   placeholder="Transaction ID or note">
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary"
                                data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">
                            Save Payment
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/payment.js"></script>
</body>
</html>
