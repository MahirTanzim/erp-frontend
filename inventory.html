
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="d-flex">
        <div class="bg-dark text-white p-3" style="width:250px;min-height:100vh;">
            <h4 class="mb-4">ERP System</h4>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link text-white" href="dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="employees.html">Employees</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="departments.html">Departments</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="products.html">Products</a></li>
                <li class="nav-item"><a class="nav-link text-white active" href="inventory.html">Inventory</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="warehouses.html">Warehouses</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#">Suppliers</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#">Purchase Orders</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#">Customers</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#">Sales Orders</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#">Invoices</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#">Payments</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#">Users</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#">Audit Logs</a></li>
                <li class="nav-item mt-3">
                    <button class="btn btn-danger w-100" onclick="logout()">Logout</button>
                </li>
            </ul>
        </div>

        <main class="flex-grow-1 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Inventory</h2>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addInventoryModal">Add
                    Inventory</button>
            </div>

            <div id="inventoryError" class="alert alert-danger d-none"></div>

            <div class="card">
                <div class="card-body table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Product</th>
                                <th>Warehouse</th>
                                <th>Quantity</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTableBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div class="modal fade" id="addInventoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add Inventory</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <div id="formError" class="alert alert-danger d-none"></div>

                    <div class="mb-3">
                        <label for="productId" class="form-label">Product</label>
                        <select id="productId" class="form-select" required>
                            <option value="">Loading products...</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="warehouseId" class="form-label">Warehouse</label>
                        <select id="warehouseId" class="form-select" required>
                            <option value="">Loading warehouses...</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="quantity" class="form-label">Quantity</label>
                        <input type="number" id="quantity" class="form-control" min="0.01" step="any" required>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button type="button" class="btn btn-primary" onclick="addInventory()">
                        Save Inventory
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/inventory.js"></script>
</body>

</html>
