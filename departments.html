<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Departments - ERP</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->

    <div class="sidebar bg-dark text-white p-3">

        <h4 class="mb-4">ERP System</h4>

        <ul class="nav flex-column">

            <li>
                <a class="nav-link text-white"
                   href="dashboard.html">
                    Dashboard
                </a>
            </li>

            <li>
                <a class="nav-link text-white"
                   href="employees.html">
                    Employees
                </a>
            </li>

            <li>
                <a class="nav-link text-white"
                   href="departments.html">
                    Departments
                </a>
            </li>

            <li>
                <a class="nav-link text-white" href="#">Products</a>
            </li>

            <li>
                <a class="nav-link text-white" href="#">Inventory</a>
            </li>

            <li>
                <a class="nav-link text-white" href="#">Warehouses</a>
            </li>

            <li>
                <a class="nav-link text-white" href="#">Suppliers</a>
            </li>

            <li>
                <a class="nav-link text-white" href="#">Purchase Orders</a>
            </li>

            <li>
                <a class="nav-link text-white" href="#">Customers</a>
            </li>

            <li>
                <a class="nav-link text-white" href="#">Sales Orders</a>
            </li>

            <li>
                <a class="nav-link text-white" href="#">Invoices</a>
            </li>

            <li>
                <a class="nav-link text-white" href="#">Payments</a>
            </li>

            <li>
                <a class="nav-link text-white" href="#">Users</a>
            </li>

            <li>
                <a class="nav-link text-white" href="#">Audit Logs</a>
            </li>

        </ul>

        <hr>

        <button
            class="btn btn-outline-light w-100"
            onclick="logout()">
            Logout
        </button>

    </div>


    <!-- MAIN CONTENT -->

    <div class="flex-grow-1">

        <nav class="navbar bg-light border-bottom px-4">

            <span class="navbar-brand">
                Departments
            </span>

        </nav>


        <div class="container-fluid p-4">

            <div class="d-flex justify-content-between mb-3">

                <h2>Departments</h2>

                <button
                    class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#addDepartmentModal">

                    Add Department

                </button>

            </div>


            <div class="card shadow-sm">

                <div class="card-body">

                    <div class="table-responsive">

                        <table class="table table-striped">

                            <thead>

                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Description</th>
                                    <th>Actions</th>
                                </tr>

                            </thead>

                            <tbody id="departmentTableBody">

                                <tr>
                                    <td colspan="4"
                                        class="text-center">
                                        Loading...
                                    </td>
                                </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- ADD DEPARTMENT MODAL -->

<div class="modal fade"
     id="addDepartmentModal"
     tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Add Department
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <form id="addDepartmentForm">

                    <div class="mb-3">

                        <label class="form-label">
                            Department Name
                        </label>

                        <input
                            type="text"
                            id="departmentName"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            id="departmentDescription"
                            class="form-control">
                        </textarea>

                    </div>


                    <div id="departmentError"
                         class="text-danger mb-3">
                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        Save Department

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>


<script src="js/api.js"></script>
<script src="js/department.js"></script>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
